<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2557a7"/>
      <stop offset="0.55" stop-color="#12305b"/>
      <stop offset="1" stop-color="#0b1f3d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa14a"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1f3d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 3D 두께: 아래로 밀린 어두운 면 -->
  <rect x="44" y="60" width="424" height="424" rx="104" fill="#061426"/>
  <!-- 앞면 -->
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#face)" filter="url(#shadow)"/>
  <rect x="44" y="40" width="424" height="424" rx="104" fill="url(#gloss)"/>

  <!-- 공장(중소기업 제조) 실루엣: 톱니지붕 + 굴뚝 -->
  <g fill="#ffffff">
    <path d="M132 372V262l72-44v44l72-44v44l72-44v154z"/>
    <rect x="352" y="196" width="26" height="76" rx="4"/>
  </g>
  <!-- 창문 (네이비로 뚫기) -->
  <g fill="#12305b">
    <rect x="164" y="302" width="34" height="34" rx="6"/>
    <rect x="222" y="302" width="34" height="34" rx="6"/>
    <rect x="280" y="302" width="34" height="34" rx="6"/>
  </g>
  <!-- 바닥 라인 -->
  <rect x="116" y="372" width="280" height="14" rx="7" fill="#ffffff"/>

  <!-- 오렌지 포인트: 해 -->
  <circle cx="374" cy="150" r="34" fill="url(#sun)"/>
</svg>
